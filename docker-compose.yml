# somap runs in containers. Nothing is installed on a host.
#
# This is the whole environment. The production composition is `db` + `app`:
# PostGIS, and the React Router 7 server that owns the HTTP port (plan.md
# R1) plus the TypeScript ETL that shares its image (R2). `migrate` is a
# one-shot service so `docker compose up` reaching a healthy `app` implies
# migrations already applied, never a race between the two.
#
# `tools` -- the TASK-0001 spike's Python container -- stays behind the
# `spike` profile, byte-identical to before this file restructured around
# it, for one reason: spikes/task-0001-geocoding/README.md must keep
# reproducing the numbers in RESULTS.md (plan.md R2). It is not part of the
# production composition and does not start on a plain `docker compose up`.
#
# A contributor with Docker and this repo has everything; a contributor
# without Docker has nothing to install, because there is nothing to install.
#
# See Constitution Principle VII.

services:
  db:
    # Built, not pulled. postgis/postgis is amd64-only, which would exclude
    # every self-hoster on ARM; and the component computing safety-critical
    # distances should not come from an account we cannot audit. See
    # docker/db/Dockerfile for the full reasoning.
    build:
      context: ./docker/db
    # THE DATABASE LOGS NOTHING ABOUT WHAT WAS ASKED.
    #
    # The searched address travels to PostgreSQL as a bind parameter, so a
    # database that logs statements or parameters defeats every other control
    # in this composition. These are command-line flags rather than an init
    # script on purpose: `ALTER SYSTEM` runs once on a fresh data directory and
    # is silently absent on a volume that already exists, whereas an argv flag
    # applies unconditionally on every start, cannot be overridden by
    # `ALTER SYSTEM`, and is readable from outside the container with
    # `docker inspect` or `ps` -- which is what makes it checkable rather than
    # asserted (Constitution Principle III, spec FR-023).
    #
    # Most of these are already the PostgreSQL default. They are written down
    # anyway, because "it happens to default to off in this image version" is
    # not a control, and a base-image bump could change it without anyone
    # noticing. Two of them are NOT the default and are the reason this block
    # is longer than the three settings the task names:
    #
    #   log_min_error_statement  defaults to `error`, which logs the full text
    #                            of any statement that fails. Every SQL error
    #                            would put the query into the log. `panic`
    #                            means effectively never. The error itself is
    #                            still logged; its statement is not.
    #   log_parameter_max_length defaults to -1, meaning bind parameters are
    #                            logged IN FULL wherever a statement is logged
    #                            at all. `0` means never, at any length.
    #
    # docs/privacy/verification.md step 4 shows how to check these from
    # outside, and how to prove they are load-bearing by turning them off.
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_duration=off
      - -c
      - log_replication_commands=off
      - -c
      - log_hostname=off
      # No %h (remote host) and no %r (remote host + port) in the prefix: a
      # client IP is personally identifying data under Principle III, and the
      # line prefix is the one place it can reach a log line even with
      # log_connections off.
      - -c
      - log_line_prefix=%m [%p]
      # stderr only, and no collector. With logging_collector off there is no
      # log FILE anywhere in the data volume -- everything the database says
      # goes to the container stream, which is the stream the test captures.
      # A collector would put logs somewhere the capture does not look.
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=off
    environment:
      POSTGRES_USER: somap
      POSTGRES_PASSWORD: somap
      POSTGRES_DB: somap
      # Deterministic collation. Address matching is string comparison, and
      # locale-dependent ordering would make results differ by host.
      LANG: C
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    # Docker defaults /dev/shm to 64MB. PostgreSQL's parallel workers exchange
    # tuples through shared memory, so any large parallel join dies with
    # "could not resize shared memory segment ... No space left on device".
    # Found the hard way running the TASK-0001 match-rate classification.
    shm_size: 1gb
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The ingest pipeline's fetched NDJSON, shared with the `etl` service.
      # PostgreSQL reads these files itself with a server-side COPY, which is
      # what keeps a bulk-load streaming library out of the image that also
      # serves the request path. Read-only here: the database consumes this
      # data, it never produces it.
      - etldata:/data:ro
    ports:
      # Exposed on loopback only, for inspection with a GUI client. Nothing
      # in the pipeline depends on this being published.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U somap -d somap"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot: applies app/sql/schema/*.sql in filename order (see
  # app/server/migrate.ts), then exits 0. Connects as the database owner --
  # it creates the `somap_app` role and revokes its write privileges, so it
  # cannot run as that role itself.
  migrate:
    build:
      context: ./app
      dockerfile: ../docker/app/Dockerfile
    command: ["node", "server/migrate.ts"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: somap
      POSTGRES_PASSWORD: somap
      POSTGRES_DB: somap
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ./app
      dockerfile: ../docker/app/Dockerfile
    # NO OUTBOUND CALL FROM THE QUERY PATH (spec FR-024), and a control that
    # was attempted here and could not be had.
    #
    # The strongest available form of FR-024 would be a docker network
    # declared `internal: true`: no gateway, no NAT, no route off the host at
    # all -- not "no code calls out" but "there is nowhere to call". It was
    # implemented, and it does not work for a service that must also be
    # reachable: the engine accepts the port binding and then publishes
    # nothing (`HostConfig.PortBindings` populated, `NetworkSettings.Ports`
    # empty, host connection refused). A container on an internal network
    # cannot have a published port, so `app` cannot be both isolated this way
    # and serve a browser.
    #
    # What stands instead, all three checkable from outside this file:
    #   - No module in the request path names a network client API, and the
    #     production dependency set is fixed and asserted
    #     (app/tests/no-outbound.test.ts).
    #   - No built asset references an external origin
    #     (app/scripts/scan-external-origins.mjs, run as a build step).
    #   - `connect-src 'self'` in the Content-Security-Policy stops the client
    #     half at runtime (app/server/http.ts).
    # docs/privacy/verification.md §6 records this as a known limit rather
    # than leaving a reader to wonder why the obvious control is absent.
    environment:
      PGHOST: db
      PGPORT: "5432"
      # The read-only role sql/schema/010_grants.sql grants and then
      # revokes write privileges from. The app never connects as `somap`.
      PGUSER: somap_app
      PGPASSWORD: somap_app
      PGDATABASE: somap
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # The ingest pipeline (app/etl/). Behind a profile because it is a job, not
  # a service: `docker compose up` must not start fetching a quarter of a
  # million parcels. Run it explicitly:
  #
  #   docker compose run --rm etl                fetch every source, then load
  #   docker compose run --rm etl --skip-fetch   reload from the NDJSON already
  #                                              on the volume
  #
  # Connects as the database OWNER, not as `somap_app`: sql/schema/010_grants.sql
  # revokes INSERT/UPDATE/DELETE/TRUNCATE from that role by design, which is
  # Principle IV's enforcement point and the reason the ETL needs its own
  # credentials.
  etl:
    profiles: ["etl"]
    build:
      context: ./app
      dockerfile: ../docker/app/Dockerfile
    entrypoint: ["node", "etl/ingest.ts"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: somap
      POSTGRES_PASSWORD: somap
      POSTGRES_DB: somap
      ETL_DATA_DIR: /data
    volumes:
      - etldata:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The test suite. Behind a profile because it is a job, not a service:
  #
  #   docker compose run --rm test
  #
  # Built from the Dockerfile's `build` stage rather than its runtime stage,
  # because that is the only stage carrying the dev dependencies the tests need
  # -- `tsc`, which the compile-failure fixture requires in order to prove that
  # constructing a result meaning "clear" does not type-check. The runtime image
  # deliberately still has none of them.
  #
  # Connects as `somap_app`, the same read-only role the request path uses
  # (sql/schema/010_grants.sql), so the tests exercise the query under the
  # privileges the query actually has -- not the owner's.
  #
  # Constitution Principle VII: a check run on a host is not a check. There is
  # no host here; this is the only way the suite runs.
  test:
    profiles: ["test"]
    build:
      context: ./app
      dockerfile: ../docker/app/Dockerfile
      target: build
    command: ["npm", "test"]
    # The Docker socket, and why a test container is given one.
    #
    # tests/no-logging.test.ts must read EVERY log stream this composition
    # produces -- app, HTTP server, PostgreSQL, container stdout/stderr -- and
    # prove the searched address and the client IP appear in none of them
    # (spec FR-023, User Story 4 scenario 1). Container output only exists
    # outside the container, so a test that cannot reach the engine API cannot
    # make that check at all; it could only assert that the application does
    # not log, which is the assertion, not the evidence.
    #
    # The mount is on the `test` profile alone. `docker compose up` starts db
    # and app and neither of them can see it. The test never writes through
    # the socket: it lists containers in this project and reads their logs.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: somap_app
      PGPASSWORD: somap_app
      PGDATABASE: somap
      # The running app, reached over the internal network by service name --
      # the same server a browser talks to through the published port.
      SOMAP_APP_ORIGIN: http://app:3000
      DOCKER_SOCKET: /var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_healthy

  tools:
    # Frozen (plan.md R2): the TASK-0001 spike's evidence
    # (spikes/task-0001-geocoding/RESULTS.md) must keep reproducing exactly
    # as published, so this service and docker/tools/ stay byte-identical.
    # Moving it behind a profile is the only change this feature makes here.
    profiles: ["spike"]
    build:
      context: ./docker/tools
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: somap
      PGPASSWORD: somap
      PGDATABASE: somap
    volumes:
      # Bind-mounted rather than a named volume so downloaded source data and
      # generated results are inspectable from the host without docker cp.
      # Working data lives under spikes/*/data/, which is gitignored.
      - ./spikes:/work/spikes
    working_dir: /work
    depends_on:
      db:
        condition: service_healthy
    # Stay up so `docker compose exec tools ...` is available for iterative work.
    command: ["sleep", "infinity"]

volumes:
  pgdata:
  # Fetched source NDJSON. Written by `etl`, read by `db`'s server-side COPY.
  # A named volume rather than a bind mount, because Principle VII's "nothing
  # is installed on a host" extends to not scattering 200MB of working data
  # across one.
  etldata:
