# tarrow, deployed: the same composition, from published images.
#
# `docker-compose.yml` is the development environment and the one every
# contributor and every privacy check runs against. It builds from source,
# publishes the database on loopback for inspection, and carries the fixed
# development credentials that let a stranger run `docker compose up --build`
# and have it work with nothing to invent. That is exactly right for the path
# Principle VII says must stay easy, and exactly wrong for a machine on the
# internet.
#
# This file is that composition for a deployment: pinned images instead of a
# build context, credentials that must be supplied instead of defaulted, and
# no database port published at all.
#
# WHY THIS IS A SEPARATE FILE AND NOT AN OVERRIDE
#
# The obvious move is `docker compose -f docker-compose.yml -f <override>`,
# which would let this file state only the differences and inherit the rest.
# It is not used, for one practical reason: the base file's `build:` keys
# survive a merge, so a host with no source tree gets a build attempt against
# a context that does not exist the moment an image is missing locally. A
# deployment target is defined by not having the source. This file therefore
# stands alone and names every service in full.
#
# The cost of standing alone is drift, and the drift that would matter is the
# database's logging flags below -- if they diverge, a deployed instance logs
# the addresses that `docs/privacy/verification.md` claim 1 says are recorded
# nowhere, and nothing in the development composition would notice. That is
# not left to care: `.github/workflows/publish-images.yml` resolves both files
# with `docker compose config` and fails the build if `db`'s command differs
# between them. See that workflow's `parity` job.
#
# USE
#
#   cp .env.deploy.example .env
#   # edit .env: set TARROW_IMAGE_TAG, POSTGRES_PASSWORD, PGAPPPASSWORD
#   docker compose -f docker-compose.deploy.yml up -d
#   docker compose -f docker-compose.deploy.yml --profile etl run --rm etl
#
# Full procedure, including what a reverse proxy in front of this can see:
# docs/deploy/self-hosting.md.

name: tarrow

services:
  db:
    # Pinned, never floating (Constitution Principle VII). There is no
    # default tag here on purpose: a `:latest` fallback would mean two
    # instances silently running different versions of the component
    # computing safety-critical distances, which is the precise failure the
    # pinning rule exists to prevent. Compose refuses to start without it.
    image: ${TARROW_REGISTRY:-ghcr.io/evanstern}/tarrow-db:${TARROW_IMAGE_TAG:?set TARROW_IMAGE_TAG to a published tag, e.g. sha-1a2b3c4 -- see docs/deploy/self-hosting.md}
    # THE DATABASE LOGS NOTHING ABOUT WHAT WAS ASKED.
    #
    # Byte-identical to the block in docker-compose.yml, and checked to stay
    # that way by the `parity` job in .github/workflows/publish-images.yml.
    # The reasoning for each flag lives in docker-compose.yml and is not
    # duplicated here -- one explanation, in the file a reader meets first.
    # What matters here is that a deployment gets the same guarantees as a
    # laptop, because a deployment is where they are load-bearing.
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_duration=off
      - -c
      - log_replication_commands=off
      - -c
      - log_hostname=off
      - -c
      - log_line_prefix=%m [%p]
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=off
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tarrow}
      # No default. The development composition's password is published in
      # this repository; a deployment that inherited it would be running a
      # database whose credential is in public version control.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD -- the development default is published in this repository and must not be deployed}
      POSTGRES_DB: ${POSTGRES_DB:-tarrow}
      LANG: C
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    shm_size: 1gb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - etldata:/data:ro
    # NO PUBLISHED PORT.
    #
    # docker-compose.yml publishes 127.0.0.1:55432 so a developer can point a
    # GUI client at it. A deployment has no such need and every reason not to:
    # `ports:` on a Docker host punches through the host firewall by default,
    # so a published port on a machine with a public interface is reachable
    # from more places than the operator usually thinks. `db` is reached by
    # service name over this composition's own network and nowhere else.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tarrow} -d ${POSTGRES_DB:-tarrow}"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # One-shot: applies the schema, then exits 0. `up` reaching a healthy `app`
  # therefore implies migrations already applied, never a race.
  #
  # Also where the runtime role's password is set from PGAPPPASSWORD (see
  # app/server/migrate.ts). 010_grants.sql creates `tarrow_app` with a
  # published literal password; on a deployment that value must not survive,
  # and re-setting it on every migrate is what makes that true for existing
  # clusters as well as fresh ones.
  migrate:
    image: ${TARROW_REGISTRY:-ghcr.io/evanstern}/tarrow-app:${TARROW_IMAGE_TAG:?set TARROW_IMAGE_TAG to a published tag, e.g. sha-1a2b3c4 -- see docs/deploy/self-hosting.md}
    command: ["node", "server/migrate.ts"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-tarrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-tarrow}
      PGAPPPASSWORD: ${PGAPPPASSWORD:?set PGAPPPASSWORD -- 010_grants.sql's literal `tarrow_app` is published in this repository and must not be deployed}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${TARROW_REGISTRY:-ghcr.io/evanstern}/tarrow-app:${TARROW_IMAGE_TAG:?set TARROW_IMAGE_TAG to a published tag, e.g. sha-1a2b3c4 -- see docs/deploy/self-hosting.md}
    environment:
      PGHOST: db
      PGPORT: "5432"
      # The read-only role. The app never connects as the owner.
      PGUSER: tarrow_app
      PGPASSWORD: ${PGAPPPASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:-tarrow}
      PORT: "3000"
    ports:
      # Bound to loopback by DEFAULT, which is the safe direction to be wrong
      # in: an operator who forgets to configure a proxy gets an unreachable
      # instance rather than an unintentionally public one.
      #
      # Set TARROW_BIND=0.0.0.0 only when something in front of this needs to
      # reach it across the host's network. If that proxy runs in Docker on
      # the same host, prefer putting it on this composition's network and
      # leaving the bind on loopback -- see docs/deploy/self-hosting.md, which
      # is also where the consequences of what that proxy can see are written
      # down.
      - "${TARROW_BIND:-127.0.0.1}:${TARROW_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # The ingest pipeline. A job, not a service -- behind a profile so that
  # `up` never starts fetching a quarter of a million parcels:
  #
  #   docker compose -f docker-compose.deploy.yml --profile etl run --rm etl
  #   docker compose -f docker-compose.deploy.yml --profile etl run --rm etl --skip-fetch
  #
  # Connects as the database OWNER: 010_grants.sql revokes write privileges
  # from tarrow_app by design (Principle IV's enforcement point), so the ETL
  # needs its own credentials.
  etl:
    profiles: ["etl"]
    image: ${TARROW_REGISTRY:-ghcr.io/evanstern}/tarrow-app:${TARROW_IMAGE_TAG:?set TARROW_IMAGE_TAG to a published tag, e.g. sha-1a2b3c4 -- see docs/deploy/self-hosting.md}
    entrypoint: ["node", "etl/ingest.ts"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-tarrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-tarrow}
      ETL_DATA_DIR: /data
    volumes:
      - etldata:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata:
  # Fetched source NDJSON. Written by `etl`, read by `db`'s server-side COPY.
  etldata:
